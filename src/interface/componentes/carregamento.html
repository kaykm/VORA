<section id="loadingScreen" role="dialog" aria-modal="true" aria-labelledby="loadingTitle" tabindex="-1">
 <div class="loading-card">
  <div class="loading-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-vora"></use></svg><span>VORA</span></div>
  <h1 id="loadingTitle">Preparando seu parque</h1>
  <p id="loadingStatus" role="status" aria-live="polite">Iniciando o carregamento…</p>
  <div class="loading-meter"><span id="loadingPercent">0%</span><span class="loading-caption">CARREGANDO</span></div>
  <div id="loadingProgress" role="progressbar" aria-label="Preparação do jogo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="loadingFill"></span></div>
  <p class="loading-note">O cenário está sendo preparado em etapas.</p>
  <p id="loadingError" role="alert" hidden></p>
  <button id="loadingRetry" type="button" hidden>Tentar novamente</button>
 </div>
</section>
