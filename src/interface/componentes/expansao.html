<dialog id="skillTreeModal" class="skill-tree-overlay" data-menu="settings" aria-labelledby="skillTreeTitle">
 <header><h2 id="skillTreeTitle">Skill tree</h2><button type="button" class="close" data-close aria-label="Fechar skill tree"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"></use></svg></button></header>
</dialog>
<canvas id="objectHighlight" class="inspection-effects" width="1" height="1" hidden aria-hidden="true"></canvas>
<div id="objectHoldHint" class="inspection-hold-hint" hidden aria-hidden="true"><i></i>Analisando <b id="objectHoldProgress">0%</b></div>
<dialog id="objectCheckModal" class="inspection-scene" data-menu="cargo" aria-labelledby="objectCheckTitle" aria-describedby="objectCheckReason">
 <div class="inspection-shade" aria-hidden="true"></div>
 <header class="inspection-toolbar"><span>ANÁLISE DO OBJETO</span><button type="button" class="close" data-close aria-label="Fechar inspeção"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"></use></svg></button></header>
 <div class="inspection-annotations" tabindex="0" role="region" aria-label="Informações do objeto selecionado">
  <section id="inspectionIdentity" class="inspection-callout inspection-identity">
   <span class="inspection-eyebrow">Identificação</span><h2 id="objectCheckTitle">Objeto</h2>
   <p id="objectCheckMaterial"></p><small id="objectCheckSpawn"></small>
  </section>
  <section id="inspectionLoad" class="inspection-callout inspection-load">
   <dl><div><dt>Carga obtida</dt><dd id="objectCheckVolume"></dd></div><div><dt>Dimensões · L × A × P</dt><dd id="objectCheckSize"></dd></div></dl>
  </section>
  <section id="inspectionValue" class="inspection-callout inspection-value">
   <span class="inspection-eyebrow">Valor de venda</span><strong id="objectCheckValue"></strong>
  </section>
  <section id="inspectionFit" class="inspection-callout inspection-fit">
   <b id="objectCheckStatus"></b><p id="objectCheckReason"></p>
   <dl><div><dt>Raio exigido</dt><dd id="objectCheckRadius"></dd></div></dl>
  </section>
 </div>
 <p class="inspection-exit-hint">Mova o mouse para explorar <span>·</span> <kbd>Esc</kbd> para voltar</p>
</dialog>
